openapi: 3.0.3
info:
  title: 家事 Agent API
  version: 0.1.0
  description: |
    家事 Agent（HomeAgent）后端接口。
    对话为主入口：SSE 流式对话 + 工具调用 + 结果卡片 + 撤销。
    契约先行：改接口先改本文件，再 make generate（CONVENTIONS-backend §1）。
servers:
  - url: /api/v1
    description: 同域反向代理
  - url: http://localhost:8080/api/v1
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 认证（JWT 令牌）
  - name: system
    description: 健康/模型/工具清单
  - name: chat
    description: 对话（SSE 流式）
  - name: expense
    description: 记账/预算
  - name: task
    description: 家务任务
  - name: meal
    description: 报饭
  - name: undo
    description: 撤销
  - name: admin
    description: 审计/用量（管理端）

paths:
  /auth/token:
    post:
      tags: [auth]
      security: []
      summary: 换取 JWT 访问令牌
      description: '成员名 + auth_token 换 JWT，后续请求带 Authorization: Bearer <token>'
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: 令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health:
    get:
      tags: [system]
      security: []
      summary: 健康检查
      operationId: health
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /tools:
    get:
      tags: [system]
      summary: 当前成员权限内的工具清单
      description: 权限双保险的源头过滤（ADR-005），只返回该成员有权限调用的工具。
      operationId: listTools
      responses:
        '200':
          description: 工具清单
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolSpec'

  /models:
    get:
      tags: [system]
      summary: 已启用模型清单（会话内切换用）
      operationId: listModels
      responses:
        '200':
          description: 模型清单
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'

  /admin/providers:
    get:
      tags: [admin]
      summary: 供应商配置清单（含脱敏密钥）
      description: |
        api_key 落库加密，此接口只返回脱敏值（如 sk-a***nop）。
        仅供管理端编辑回显，禁止回传明文（ADR 安全约束）。
      operationId: listProviders
      responses:
        '200':
          description: 供应商清单
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/providers/test:
    post:
      tags: [admin]
      summary: 测试供应商连通性
      description: 发送轻量请求探测 API 端点与密钥有效性，返回响应状态、延迟及错误信息。只有 parent 角色可写。
      operationId: testProviderConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderTestRequest'
      responses:
        '200':
          description: 测试结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTestResult'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/providers/{providerId}:
    put:
      tags: [admin]
      summary: 更新供应商配置（加密存密钥）
      description: |
        api_key 传入即加密覆盖；传空串或省略表示不改密钥。
        只有 parent 角色可写（权限双保险：路由层 + 执行层）。
      operationId: updateProvider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                  format: password
                  description: 明文密钥，服务端加密入库；空串/省略 = 不修改
                base_url:
                  type: string
                  description: 供应商 API 地址，空用供应商默认
                enabled:
                  type: boolean
      responses:
        '200':
          description: 更新后的供应商（脱敏）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/models:
    get:
      tags: [admin]
      summary: 获取全量模型清单（含停用模型，管理端配置用）
      description: 返回当前系统内所有模型（无论是否启用）。只有 parent 角色可读。
      operationId: listAllModels
      responses:
        '200':
          description: 模型清单
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: 添加自定义模型
      description: 为指定供应商添加可用模型，支持配置展示名称与上下文窗口。只有 parent 角色可写。
      operationId: createModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreate'
      responses:
        '201':
          description: 创建成功的模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/models/{modelId}:
    put:
      tags: [admin]
      summary: 更新模型配置（名称/标识/启停/设默认）
      description: |
        支持修改模型展示名称、实际请求模型标识、启停与设为全局默认。
        设默认模型是互斥操作：旧默认自动取消。
        只有 parent 角色可写。
      operationId: updateModel
      parameters:
        - $ref: '#/components/parameters/ModelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model_name:
                  type: string
                  description: 实际请求模型标识
                display_name:
                  type: string
                  description: 页面展示名称
                context_window:
                  type: integer
                enabled:
                  type: boolean
                is_default:
                  type: boolean
                  description: 设为全局默认（互斥，旧默认自动取消）
      responses:
        '200':
          description: 更新后的模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      summary: 删除自定义模型
      description: 删除非默认自定义模型。只有 parent 角色可写。
      operationId: deleteModel
      parameters:
        - $ref: '#/components/parameters/ModelId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat:
    post:
      tags: [chat]
      summary: 发送对话消息（SSE 流式回复）
      description: |
        流式返回三类事件：token（文本增量）、tool_call（工具执行回执）、done（结束）。
        客户端断开必须触发取消（CONVENTIONS-backend §5）。
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string
                description: 'event: token|tool_call|done; data: json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /conversations:
    get:
      tags: [chat]
      summary: 会话列表
      operationId: listConversations
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  next_cursor:
                    type: string
    post:
      tags: [chat]
      summary: 新建会话（可指定模型）
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model_id:
                  type: string
                  description: 为空则用默认模型
                title:
                  type: string
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /conversations/{conversationId}:
    delete:
      tags: [chat]
      summary: 删除会话（软删除）
      operationId: deleteConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '204':
          description: 已删除

  /conversations/{conversationId}/messages:
    get:
      tags: [chat]
      summary: 会话历史消息
      operationId: listMessages
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 消息列表（按时间正序）
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'

  /expenses:
    get:
      tags: [expense]
      summary: 记账流水（按成员隔离）
      operationId: listExpenses
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageCursor'
        - in: query
          name: category
          description: 按分类过滤
          schema:
            type: string
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 流水列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Expense'
                  next_cursor:
                    type: string
    post:
      tags: [expense]
      summary: 手动记一笔（对话外直接记账，同样幂等可撤销）
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreate'
      responses:
        '201':
          description: 已记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '409':
          $ref: '#/components/responses/Conflict'

  /expenses/{expenseId}:
    patch:
      tags: [expense]
      summary: 修正一笔账单（金额/类目/备注，可撤销）
      operationId: updateExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseUpdate'
      responses:
        '200':
          description: 已修正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /expenses/summary:
    get:
      tags: [expense]
      summary: 记账汇总（按分类/按月）
      operationId: expenseSummary
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [month, year]
            default: month
      responses:
        '200':
          description: 汇总
          content:
            application/json:
              schema:
                type: object
                required: [total_cents, categories]
                properties:
                  total_cents:
                    type: integer
                    description: 总支出（分）
                  categories:
                    type: array
                    items:
                      type: object
                      required: [category, total_cents]
                      properties:
                        category:
                          type: string
                        total_cents:
                          type: integer

  /budget:
    get:
      tags: [expense]
      summary: 预算执行情况（query_budget 工具的 HTTP 出口）
      operationId: queryBudget
      parameters:
        - in: query
          name: category
          schema:
            type: string
      responses:
        '200':
          description: 预算执行
          content:
            application/json:
              schema:
                type: object
                required: [budget_cents, spent_cents]
                properties:
                  budget_cents:
                    type: integer
                  spent_cents:
                    type: integer
                  over_budget:
                    type: boolean

  /tasks:
    get:
      tags: [task]
      summary: 我的任务（list_my_tasks 的 HTTP 出口，只返当前成员）
      operationId: listTasks
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/TaskStatus'
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
    post:
      tags: [task]
      summary: 派任务（assign_task 的 HTTP 出口）
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: 已派发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResult'

  /tasks/{taskId}/complete:
    post:
      tags: [task]
      summary: 打卡完成（complete_task 的 HTTP 出口，防重复打卡）
      operationId: completeTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 已完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResult'
        '409':
          $ref: '#/components/responses/Conflict'

  /notifications:
    get:
      tags: [notification]
      summary: 通知中心列表（新的在前，未读优先）
      operationId: listNotifications
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 通知列表
          content:
            application/json:
              schema:
                type: object
                required: [items, unread_count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  unread_count:
                    type: integer
                    description: 未读数（前端封顶 99+）
    post:
      tags: [notification]
      summary: 标记已读（全部或单条）
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_id:
                  type: string
                  description: 留空=全部已读
      responses:
        '200':
          description: 已标记
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                properties:
                  marked:
                    type: integer
                    description: 标记已读的条数

  /meals:
    get:
      tags: [meal]
      summary: 今日报饭汇总（给做饭人）
      operationId: listMeals
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
            description: 为空取今日
      responses:
        '200':
          description: 报饭汇总
          content:
            application/json:
              schema:
                type: object
                required:
                  [date, at_home_count, not_at_home_count, members, unreported_count, unreported]
                properties:
                  date:
                    type: string
                    format: date
                  at_home_count:
                    type: integer
                  not_at_home_count:
                    type: integer
                  members:
                    type: array
                    description: 已申报成员（在家/不在家）
                    items:
                      type: object
                      required: [member_id, name, at_home]
                      properties:
                        member_id:
                          type: string
                        name:
                          type: string
                        at_home:
                          type: boolean
                  unreported_count:
                    type: integer
                    description: 未申报人数
                  unreported:
                    type: array
                    description: 未申报成员名单（缺口显式，P6）
                    items:
                      type: object
                      required: [member_id, name]
                      properties:
                        member_id:
                          type: string
                        name:
                          type: string
    post:
      tags: [meal]
      summary: 报饭（report_meal 的 HTTP 出口，人+日期幂等）
      operationId: reportMeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [at_home]
              properties:
                at_home:
                  type: boolean
                date:
                  type: string
                  format: date
                  description: 为空取今日
                note:
                  type: string
      responses:
        '200':
          description: 已报饭
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealReport'

  /events:
    get:
      tags: [calendar]
      summary: 日程列表（按时间窗口，重复事件展开为实例）
      operationId: listEvents
      description: |
        返回窗口内的事件实例（单次事件直接返回，重复事件按规则展开）。
        可见性过滤：private 事件只有创建人与家长可见（权限双保险，执行层再校验一次）。
      parameters:
        - in: query
          name: start
          description: 窗口起点（为空取今日 0 点）
          schema:
            type: string
            format: date-time
        - in: query
          name: end
          description: 窗口终点（为空取今日 +30 天）
          schema:
            type: string
            format: date-time
        - in: query
          name: scope
          description: my=只看我相关的；family=全家可见的（默认）
          schema:
            type: string
            enum: [my, family]
            default: family
      responses:
        '200':
          description: 事件实例列表（按 start_at 升序）
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventInstance'
    post:
      tags: [calendar]
      summary: 建事件（create_event 的 HTTP 出口，幂等）
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResult'
        '409':
          $ref: '#/components/responses/Conflict'

  /events/{eventId}:
    get:
      tags: [calendar]
      summary: 事件详情（单个事件，按可见性过滤）
      operationId: getEvent
      description: |
        返回事件的详情视图。private 事件只有创建人可见（服务端校验，不只靠前端隐藏）。
        用于「对话结果卡片 → 日程详情」深链；对象不存在或无权限时返回 404（不区分二者，避免探测）。
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 事件详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [calendar]
      summary: 删除事件（整条系列，可撤销）
      operationId: deleteEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [undo_id]
                properties:
                  undo_id:
                    type: string
                    description: 撤销 id（POST /undo/{id} 用）
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventId}/instances/{occurrence}:
    delete:
      tags: [calendar]
      summary: 删除重复事件的单个实例（例外，不影响系列）
      operationId: skipEventInstance
      parameters:
        - $ref: '#/components/parameters/EventId'
        - in: path
          name: occurrence
          required: true
          description: 该实例按规则展开的发生时间（RFC3339，URL 编码）
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 已跳过该实例
        '404':
          $ref: '#/components/responses/NotFound'

  /today:
    get:
      tags: [today]
      summary: 今日行动摘要（个人，服务端聚合）
      operationId: getToday
      description: |
        聚合「需要我处理 / 今日安排 / 家庭用餐 / 通知动态」四块，供首页 Today 使用。
        权限服务端一次性裁剪：任务只看我的、日程按可见性、通知只看我的。
        「未申报」原样保留，不转写为「不在家」（A-01-03）。
        局部失败策略（A-01-06）：某模块失败时其余照常返回，前端按区域降级。
      responses:
        '200':
          description: 今日摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodaySummary'

  /undo:
    get:
      tags: [undo]
      summary: 我的可撤销操作（24h 内有效，最新的在前）
      operationId: listUndo
      description: |
        列出当前成员 24h 窗口内**未使用且未过期**的撤销项。
        已撤销/已过期的记录不返回；成员隔离（只看自己的）。
      responses:
        '200':
          description: 可撤销项列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UndoItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /undo/{undoId}:
    post:
      tags: [undo]
      summary: 撤销一次写操作（24h 内有效）
      operationId: undo
      parameters:
        - $ref: '#/components/parameters/UndoId'
      responses:
        '200':
          description: 已撤销
          content:
            application/json:
              schema:
                type: object
                required: [undone]
                properties:
                  undone:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: 撤销已过期或已使用

  /audit:
    get:
      tags: [admin]
      summary: 审计日志（只增不改，按权限可见）
      operationId: listAudit
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageCursor'
        - in: query
          name: tool_name
          schema:
            type: string
        - in: query
          name: permission_denied
          description: 只看越权尝试
          schema:
            type: boolean
      responses:
        '200':
          description: 审计列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  next_cursor:
                    type: string

  /usage:
    get:
      tags: [admin]
      summary: LLM 用量统计（管理端仪表盘）
      operationId: listUsage
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: 用量
          content:
            application/json:
              schema:
                type: object
                required: [total_cost, total_tokens, items]
                properties:
                  total_cost:
                    type: number
                    format: double
                  total_tokens:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      required: [date, tokens, cost]
                      properties:
                        date:
                          type: string
                          format: date
                        tokens:
                          type: integer
                        cost:
                          type: number
                          format: double

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageSize:
      in: query
      name: page_size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageCursor:
      in: query
      name: cursor
      schema:
        type: string
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
        format: uuid
    ExpenseId:
      in: path
      name: expenseId
      required: true
      schema:
        type: string
        format: uuid
    UndoId:
      in: path
      name: undoId
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      in: path
      name: providerId
      required: true
      schema:
        type: string
        format: uuid
    ModelId:
      in: path
      name: modelId
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      in: path
      name: eventId
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 幂等冲突（重复提交）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    TokenRequest:
      type: object
      required: [name, auth_token]
      properties:
        name:
          type: string
          example: 爸爸
          description: 成员名（家庭内唯一）
        auth_token:
          type: string
          format: password
          description: 成员预共享密钥，开发期由 --migrate 生成并打印到日志

    Notification:
      type: object
      required: [id, type, title, body, read, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [task_due, chore_overdue, meal_gap, bill_due, budget_over, report]
          description: 通知类型（ADR-006）
        title:
          type: string
        body:
          type: string
        ref_type:
          type: string
          description: 关联对象类型，如 task / meal_report
        ref_id:
          type: string
        action_label:
          type: string
          description: 行动按钮文案，如「去打卡」
        action_path:
          type: string
          description: 行动跳转路径，如 /chores
        read:
          type: boolean
        created_at:
          type: string
          format: date-time

    TokenResponse:
      type: object
      required: [token, member_id, role, expires_at]
      properties:
        token:
          type: string
          description: 'JWT，请求头放 Authorization: Bearer <token>'
        member_id:
          type: string
          format: uuid
        role:
          type: string
          description: 成员角色（parent/elder/child 等）
        expires_at:
          type: string
          format: date-time

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            [
              invalid_input,
              invalid_credentials,
              unauthorized,
              permission_denied,
              not_found,
              conflict,
              internal,
            ]
          description: 程序判断用（apperr.Code）。invalid_credentials=登录凭据错误（防枚举：成员不存在与令牌错误同码）；unauthorized=已登录态令牌失效/过期
        message:
          type: string
          description: 面向用户的中文信息（不泄漏堆栈/SQL）
        trace_id:
          type: string

    ToolSpec:
      type: object
      required: [name, description, risk, permission, module]
      properties:
        name:
          type: string
          example: record_expense
        description:
          type: string
        input_schema:
          type: object
          additionalProperties: true
        risk:
          $ref: '#/components/schemas/RiskLevel'
        permission:
          type: string
          example: expense.write
        module:
          type: string
          example: expense
        idempotency:
          type: string
          example: user+amount+hint+day

    RiskLevel:
      type: string
      enum: [low, medium, high]

    Model:
      type: object
      required: [id, model_name, display_name, enabled]
      properties:
        id:
          type: string
          format: uuid
        model_name:
          type: string
          example: gpt-4o
        display_name:
          type: string
          example: GPT-4o
        provider:
          type: string
          example: openai
        is_default:
          type: boolean
        enabled:
          type: boolean

    ModelCreate:
      type: object
      required: [provider_id, model_name, display_name]
      properties:
        provider_id:
          type: string
          format: uuid
          description: 所属供应商 ID
        model_name:
          type: string
          example: Atria-Dawn-Preview
          description: 实际请求模型名
        display_name:
          type: string
          example: Atria 深度推理
          description: 前端展示名称
        context_window:
          type: integer
          default: 131072
        is_default:
          type: boolean
          default: false

    Provider:
      type: object
      required: [id, name, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: deepseek
          description: 供应商标识（枚举，见 shared ProviderName）
        base_url:
          type: string
          example: https://api.deepseek.com
        api_key_masked:
          type: string
          example: sk-a***nop
          description: 脱敏密钥（明文绝不回传）
        api_key_set:
          type: boolean
          description: 是否已配置密钥（空密钥时 false）
        enabled:
          type: boolean

    ProviderTestRequest:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
          description: 已有供应商 ID（若提供，缺失字段从已有配置读取）
        base_url:
          type: string
          description: 覆盖或指定的 API Base URL
        api_key:
          type: string
          format: password
          description: 覆盖或指定的 API Key（留空则尝试用库中已存 Key）
        model:
          type: string
          description: 测试探测所用模型名（如 Atria-Dawn-Preview / deepseek-chat 等）

    ProviderTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          description: 是否连接成功
        latency_ms:
          type: integer
          description: 探测往返耗时（毫秒）
        error:
          type: string
          description: 错误详情（如 401 密钥无效 / 402 余额不足 / 404 地址错）
        models:
          type: array
          items:
            type: string
          description: 探测发现的可用模型清单（若端点支持 /v1/models）

    ChatRequest:
      type: object
      required: [content]
      properties:
        conversation_id:
          type: string
          format: uuid
          description: 为空则新建会话
        content:
          type: string
          description: 用户消息
        model_id:
          type: string
          format: uuid
          description: 会话内切模型（为空沿用会话当前模型）

    Conversation:
      type: object
      required: [id, member_id]
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        title:
          type: string
        model_id:
          type: string
          format: uuid
        last_message_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Message:
      type: object
      required: [id, conversation_id, role, content]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, tool, system]
        content:
          type: string
        tool_name:
          type: string
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time

    Expense:
      type: object
      required: [id, member_id, amount_cents, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        category:
          type: string
          example: 食材
        amount_cents:
          type: integer
          description: 金额（分）
        hint:
          type: string
          example: 买菜
        note:
          type: string
        occurred_at:
          type: string
          format: date-time
        undoable:
          type: boolean
          description: 是否在 24h 撤销窗口内

    ExpenseCreate:
      type: object
      required: [amount_cents, hint]
      properties:
        amount_cents:
          type: integer
          minimum: 1
        hint:
          type: string
        category:
          type: string
        occurred_at:
          type: string
          format: date-time

    ExpenseUpdate:
      type: object
      description: 修正账单（部分更新，至少传一个字段）
      minProperties: 1
      properties:
        amount_cents:
          type: integer
          minimum: 1
          description: 修正后的金额（分）
        hint:
          type: string
          description: 修正后的内容
        category:
          type: string
          description: 修正后的分类

    TaskStatus:
      type: string
      enum: [pending, in_progress, done]

    Task:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: 洗碗
        description:
          type: string
        risk:
          $ref: '#/components/schemas/RiskLevel'
        assignee_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TaskStatus'
        due_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        points:
          type: integer

    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        assignee_id:
          type: string
          format: uuid
        due_at:
          type: string
          format: date-time

    TaskResult:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required: [undoable]
          properties:
            undoable:
              type: boolean
              description: 是否可撤销（幂等命中时为 false）
            undo_id:
              type: string
              description: 撤销 id（POST /undo/{id} 用）
            duplicated:
              type: boolean
              description: 是否幂等命中（重复派发）

    UndoItem:
      type: object
      required: [undo_id, tool_name, summary, created_at, expires_at]
      properties:
        undo_id:
          type: string
          format: uuid
          description: 撤销 id（POST /undo/{id} 用）
        tool_name:
          type: string
          description: 工具名，如 record_expense / assign_task
        summary:
          type: string
          description: 人类可读摘要，如「记账 ¥12.00 · 食材」
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 过期时间（前端据此显示剩余窗口）

    MealReport:
      type: object
      required: [id, member_id, date, at_home]
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        at_home:
          type: boolean
        note:
          type: string

    AuditLog:
      type: object
      required: [id, tool_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        trace_id:
          type: string
        member_id:
          type: string
          format: uuid
        tool_name:
          type: string
        risk:
          $ref: '#/components/schemas/RiskLevel'
        params:
          type: object
          additionalProperties: true
        result:
          type: string
        undone:
          type: boolean
        permission_denied:
          type: boolean
          description: 越权尝试记录
        latency_ms:
          type: integer
        created_at:
          type: string
          format: date-time

    EventRepeat:
      type: string
      enum: [once, daily, weekly, monthly]
      description: 重复规则；once=单次

    EventVisibility:
      type: string
      enum: [family, private]
      description: family=全家可见；private=仅本人与家长

    EventInstance:
      type: object
      description: 展开后的一个日程实例（重复事件按规则展开，含例外）
      required: [id, title, start_at, repeat, visibility, owner_id, occurrence, is_exception]
      properties:
        id:
          type: string
          format: uuid
          description: 事件 id（系列 id；同系列实例共享）
        title:
          type: string
          example: 开家长会
        description:
          type: string
        start_at:
          type: string
          format: date-time
          description: 实例开始时间（例外时为改后的时间）
        end_at:
          type: string
          format: date-time
        repeat:
          $ref: '#/components/schemas/EventRepeat'
        visibility:
          $ref: '#/components/schemas/EventVisibility'
        owner_id:
          type: string
          format: uuid
          description: 创建人（前端取成员颜色）
        owner_name:
          type: string
        is_lunar:
          type: boolean
          description: 农历事件
        location:
          type: string
        occurrence:
          type: string
          format: date-time
          description: 该实例按规则展开的原发生时间（例外定位用；单次=开始时间）
        is_exception:
          type: boolean
          description: 是否为被改动/跳过的例外实例
        skipped:
          type: boolean
          description: 该实例被跳过（删单次）

    EventCreate:
      type: object
      required: [title, start_at]
      properties:
        title:
          type: string
          example: 开家长会
        description:
          type: string
        start_at:
          type: string
          format: date-time
          description: 开始时间（自然语言解析后传入，或页面手填）
        end_at:
          type: string
          format: date-time
        repeat:
          $ref: '#/components/schemas/EventRepeat'
        interval:
          type: integer
          minimum: 1
          default: 1
          description: 重复间隔（每 N 天/周/月）
        visibility:
          $ref: '#/components/schemas/EventVisibility'
        is_lunar:
          type: boolean
          description: 农历事件（生日/纪念日）
        location:
          type: string

    EventResult:
      type: object
      required: [id, title, start_at, undoable]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        start_at:
          type: string
          format: date-time
        repeat:
          $ref: '#/components/schemas/EventRepeat'
        undoable:
          type: boolean
          description: 是否可撤销（幂等命中时为 false）
        undo_id:
          type: string
          description: 撤销 id（POST /undo/{id} 用）
        duplicated:
          type: boolean
          description: 是否幂等命中（重复建同一事件）

    EventDetail:
      type: object
      description: 事件详情（供「去日程详情」深链；不含实例展开，只描述事件本身）
      required: [id, title, start_at, repeat, visibility, owner_id, can_edit, can_cancel_series, actions]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        repeat:
          $ref: '#/components/schemas/EventRepeat'
        interval:
          type: integer
          description: 重复间隔
        visibility:
          $ref: '#/components/schemas/EventVisibility'
        owner_id:
          type: string
          format: uuid
        owner_name:
          type: string
        is_lunar:
          type: boolean
        location:
          type: string
        can_edit:
          type: boolean
          description: 本期是否允许修改（当前固定 false：暂无修改接口，前端据此隐藏入口）
        can_cancel_series:
          type: boolean
          description: 是否可删除整条系列（创建人可删自己的）
        actions:
          type: array
          description: 该事件当前可执行的操作（服务端按权限给出，前端照此渲染）
          items:
            type: object
            required: [label, kind]
            properties:
              label:
                type: string
                example: 删除整条日程
              kind:
                type: string
                enum: [cancel_series]
                description: 操作类型；本期仅 cancel_series（删整系列）

    TodaySummary:
      type: object
      description: 今日行动摘要（PRD A-01）
      required: [need_action, schedule, meal, activity]
      properties:
        need_action:
          type: object
          description: 需要我处理（强行动区；普通未读消息不混入）
          required: [tasks, meal_unreported, notifications]
          properties:
            tasks:
              type: array
              description: 我的未完成任务
              items:
                type: object
                required: [id, title, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  status:
                    type: string
                    enum: [pending, in_progress]
                  due_at:
                    type: string
                    format: date-time
                    description: 截止时间（空串=无截止）
            meal_unreported:
              type: boolean
              description: 我今天尚未申报用餐
            notifications:
              type: array
              description: 未读且需回应的通知（有限条）
              items:
                $ref: '#/components/schemas/TodayActivity'
        schedule:
          type: array
          description: 今日可见日程（私密日程按可见性过滤）
          items:
            type: object
            required: [id, title, start_at]
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              start_at:
                type: string
                format: date-time
              end_at:
                type: string
                format: date-time
              owner_name:
                type: string
              visibility:
                $ref: '#/components/schemas/EventVisibility'
        meal:
          type: object
          description: 家庭用餐概览与我的状态
          required: [date, at_home, not_at_home, unreported, mine]
          properties:
            date:
              type: string
              format: date
            at_home:
              type: array
              items:
                type: string
              description: 今晚在家吃的成员名
            not_at_home:
              type: array
              items:
                type: string
            unreported:
              type: array
              items:
                type: string
              description: 尚未申报的成员名（缺口显式，不等于不在家）
            mine:
              type: string
              enum: [at_home, not_at_home, unreported]
              description: 我自己的申报状态
        activity:
          type: array
          description: 与我相关的通知动态（有限条，新的在前；已读≠事务已完成）
          items:
            $ref: '#/components/schemas/TodayActivity'

    TodayActivity:
      type: object
      required: [id, type, title, read, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: 通知类型（task_due / meal_gap 等）
        title:
          type: string
        body:
          type: string
        action_label:
          type: string
          description: 通知附带操作的按钮文案（可空）
        action_path:
          type: string
          description: 通知附带操作的跳转路径（可空，前端按路径跳转）
        read:
          type: boolean
          description: 是否已读（≠ 事务已完成）
        created_at:
          type: string
          format: date-time
